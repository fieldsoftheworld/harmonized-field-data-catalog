[project]
name = "harmonized-field-data-catalog"
version = "0.1.0"
description = "Git-backed Portolan catalog of harmonized (fiboa) field boundary datasets"
requires-python = ">=3.11"
# The tooling has no package to install; pixi manages the environment below.
dependencies = []

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[tool.pixi.dependencies]
python = ">=3.11,<3.14"
# Tiles for the staging step in tools/build.py (ogr2ogr reads the GeoParquet)
libgdal-arrow-parquet = ">=3.8"
tippecanoe = ">=2.70"
unrar = ">=0.4"
# Catalog tooling (pyarrow/pyproj/rasterio/rio-cogeo let rashid run its byte checks locally)
duckdb = ">=1.1"
pyarrow = ">=17"
pyproj = ">=3.6"
rasterio = ">=1.4"
rio-cogeo = ">=5.0"
pillow = ">=10"
boto3 = ">=1.35"
pyyaml = ">=6.0"
requests = ">=2.32"
nodejs = ">=26.8.2,<26.9"

[tool.pixi.pypi-dependencies]
# fiboa-cli is the single source of conversion logic. tools/build.py calls its
# convert, validate and create-stac-collection through $FIBOA_CMD (default:
# `fiboa` on PATH), so a checkout with unreleased converter fixes can be used,
# and records its version in every collection.
# TODO(pin): fiboa-cli = "==0.22.0" once released, and drop FIBOA_CMD.
# Validators, pinned to what CI runs (.github/workflows/ci.yml).
rashid = "==0.1.7"
# One archive of every collection's newest edition at the catalog root (tools/root_tiles.py)
tylertoo = "==0.7.1"
stac-check = ">=1.6"

[tool.pixi.tasks]
gates = "python tests/run_all.py"
build = "python tools/build.py"
upload = "python tools/upload_data.py"
publish = "python tools/publish.py"
thumbnail = "python tools/thumbnail.py"
